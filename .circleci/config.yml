version: 2.1

jobs:
  test:
    docker:
      - image: cypress/base:20.9.0
    steps:
      - run:
          name: Install PHP 8.2 and Composer
          command: |
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update
            sudo apt-get install -y php8.2 php8.2-cli php8.2-mbstring php8.2-xml php8.2-curl php8.2-zip php8.2-pdo php8.2-mysql unzip
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      
      - checkout
      
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
      - run: composer install --no-interaction --prefer-dist
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor
      
      - run: |
          cp .env.example .env || echo "APP_KEY=" > .env
          php artisan key:generate
      
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.cache
      
      - run:
          command: php artisan serve
          background: true
      
      - run: npx wait-on http://127.0.0.1:8000
      
      - run: npx cypress run
      
      - store_artifacts:
          path: cypress/videos
      - store_artifacts:
          path: cypress/screenshots

workflows:
  build:
    jobs:
      - test