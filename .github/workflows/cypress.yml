name: Cypress E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CYPRESS_baseUrl: http://127.0.0.1:8000

jobs:
  cypress-tests:
    name: 🧪 Cypress E2E Tests (Chrome + Laravel + MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sys_erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 🧩 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar PHP e extensões
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip, dom, xml
          coverage: none

      - name: 📦 Instalar dependências Laravel
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 📋 Copiar .env
        run: cp .env.example .env

      - name: 🛠️ Configurar banco de dados no .env
        run: |
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=sys_erp_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          echo "✅ Configuração do banco de dados:"
          grep DB_ .env

      - name: 🔑 Gerar chave da aplicação
        run: php artisan key:generate

      - name: ⏳ Aguardar MySQL inicializar
        run: |
          echo "⏳ Aguardando MySQL..."
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "✅ MySQL disponível!"
              break
            fi
            echo "Tentativa $i/30... aguardando 2s"
            sleep 2
          done

      - name: 🧱 Rodar migrations
        run: php artisan migrate --force

      - name: 🌱 Seed banco de dados
        run: php artisan db:seed --force || echo "⚠️ Nenhum seeder configurado"

      - name: 🚀 Iniciar servidor Laravel
        run: php artisan serve --host=127.0.0.1 --port=8000 &
      
      - name: ⌛ Aguardar servidor Laravel iniciar
        run: |
          echo "⏳ Aguardando servidor Laravel..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000 > /dev/null; then
              echo "✅ Servidor Laravel ativo!"
              exit 0
            fi
            echo "Tentativa $i/30..."
            sleep 2
          done
          echo "❌ Servidor Laravel não respondeu a tempo"
          exit 1

      - name: 🧩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências Node
        run: npm ci

      - name: 🧠 Verificar instalação Cypress
        run: npx cypress verify

      - name: 🧪 Executar testes Cypress (Chrome)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headed: false
          record: false
          config: video=true,screenshotOnRunFailure=true
          wait-on: 'http://127.0.0.1:8000'
          wait-on-timeout: 60
          spec: |
            cypress/e2e/combrim.cy.js,
            cypress/e2e/criar-pedido.cy.js
        env:
          CYPRESS_baseUrl: ${{ env.CYPRESS_baseUrl }}

      - name: 📸 Upload screenshots (falhas)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: 🎥 Upload vídeos (sempre)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: 📊 Gerar relatório resumido
        if: always()
        run: |
          echo "## 🧪 Resultados dos Testes Cypress" >> $GITHUB_STEP_SUMMARY
          echo "🔹 Browser: **Chrome**" >> $GITHUB_STEP_SUMMARY
          echo "🔹 Status: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "📁 Artefatos: vídeos e screenshots estão disponíveis acima." >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Encerrar servidor
        if: always()
        run: pkill -f "php artisan serve" || true

  notify:
    name: 📢 Notificar Resultado Final
    runs-on: ubuntu-latest
    needs: [cypress-tests]
    if: always()

    steps:
      - name: 🧾 Resumo final da execução
        run: |
          echo "## 📊 Pipeline Completo" >> $GITHUB_STEP_SUMMARY
          echo "✅ Execução finalizada" >> $GITHUB_STEP_SUMMARY
          echo "Status final: **${{ needs.cypress-tests.result }}**" >> $GITHUB_STEP_SUMMARY
