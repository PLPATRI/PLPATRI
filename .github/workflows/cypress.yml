name: Cypress E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CYPRESS_baseUrl: http://127.0.0.1:8000

jobs:
  cypress-tests:
    name: Cypress E2E Tests (Chrome)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar PHP e extensões
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip, dom, xml
          coverage: none

      - name: Instalar dependências Laravel
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copiar .env
        run: cp .env.example .env

      - name: Gerar chave da aplicação
        run: php artisan key:generate

      # ⚠️ MELHORIA 1: Adicionar configuração do banco (se necessário)
      - name: Configurar banco de dados (opcional)
        run: |
          touch database/database.sqlite
          php artisan migrate --force --seed
        continue-on-error: true  # Não falha se não precisar de DB

      - name: Iniciar servidor Laravel
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Aguardar servidor subir
        run: |
          echo "⏳ Aguardando servidor Laravel..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000 > /dev/null; then
              echo "✅ Servidor respondendo!"
              exit 0
            fi
            echo "Tentativa $i/30..."
            sleep 2
          done
          echo "❌ Servidor não subiu a tempo"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências Node
        run: npm ci

      - name: Verificar Cypress
        run: npx cypress verify

      # ⚠️ MELHORIA 2: Remover wait-on duplicado (já está aguardando acima)
      - name: Executar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/combrim.cy.js,cypress/e2e/criar-pedido.cy.js
          headed: false
          record: false
          config: video=true,screenshotOnRunFailure=true,testIsolation=false
          # wait-on removido pois já aguardamos acima
        env:
          CYPRESS_baseUrl: ${{ env.CYPRESS_baseUrl }}

      # ⚠️ MELHORIA 3: Upload de screenshots sempre (não só em sucesso)
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()  # Sempre faz upload
        with:
          name: cypress-screenshots-${{ github.run_number }}
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      # ⚠️ MELHORIA 4: Upload de vídeos sempre
      - name: Upload vídeos
        uses: actions/upload-artifact@v4
        if: always()  # Sempre faz upload
        with:
          name: cypress-videos-${{ github.run_number }}
          path: cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: Gerar relatório
        if: always()
        run: |
          echo "## 🧪 Resultados dos Testes Cypress" >> $GITHUB_STEP_SUMMARY
          echo "Browser: **Chrome**" >> $GITHUB_STEP_SUMMARY
          echo "Status: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "Run: **#${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "failure" ]; then
            echo "❌ **Testes falharam**" >> $GITHUB_STEP_SUMMARY
            echo "📸 Screenshots e 🎥 vídeos disponíveis nos artefatos" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Todos os testes passaram!**" >> $GITHUB_STEP_SUMMARY
            echo "📸 Screenshots disponíveis nos artefatos" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop servidor
        if: always()
        run: pkill -f "php artisan serve" || true

  notify:
    name: Notificar Resultado
    runs-on: ubuntu-latest
    needs: [cypress-tests]
    if: always()
    
    steps:
      - name: Resultado dos testes
        run: |
          echo "## 📊 Pipeline Completo" >> $GITHUB_STEP_SUMMARY
          echo "✅ Execução finalizada" >> $GITHUB_STEP_SUMMARY
          echo "Status: **${{ needs.cypress-tests.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "Workflow: **${{ github.workflow }}**" >> $GITHUB_STEP_SUMMARY
          echo "Branch: **${{ github.ref_name }}**" >> $GITHUB_STEP_SUMMARY