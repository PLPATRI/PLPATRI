version: 2.1

jobs:
  test:
    docker:
      - image: cypress/base:20.9.0
    steps:
      - checkout
      
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
      # Etapa de Composer removida
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor
      
      # Laravel setup (mantido, mas depende do PHP já estar disponível)
      - run: |
          cp .env.example .env || echo "APP_KEY=" > .env
          php artisan key:generate || echo "Laravel setup pulado (sem PHP)"
      
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.cache
      
      # Servidor Laravel (pulável se PHP não estiver disponível)
      - run:
          name: Start Laravel Server
          command: php artisan serve || echo "Servidor Laravel não iniciado"
          background: true
      
      - run:
          name: Wait for server
          command: npx wait-on http://127.0.0.1:8000 || echo "Servidor não disponível"
      
      - run:
          name: Run Cypress Tests
          command: npx cypress run
      
      - store_artifacts:
          path: cypress/videos
      - store_artifacts:
          path: cypress/screenshots

workflows:
  build:
    jobs:
      - test
