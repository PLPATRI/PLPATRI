name: Cypress E2E Tests

# 🔁 Quando o workflow será executado
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permite execução manual

# 🌐 Variáveis de ambiente globais
env:
  CYPRESS_baseUrl: http://127.0.0.1:8000

jobs:
  # 🧪 Job principal: testes Cypress
  cypress-tests:
    name: Cypress E2E Tests (Chrome)
    runs-on: ubuntu-latest

    # 🛢️ Serviço de banco de dados MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sys_erp_test
          MYSQL_ALLOW_EMPTY_PASSWORD: no
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 📥 Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 🧰 Instala PHP e extensões necessárias para Laravel
      - name: Instalar PHP e extensões
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip, dom, xml
          coverage: none

      # 📦 Instala dependências do Laravel via Composer
      - name: Instalar dependências Laravel
        run: composer install --prefer-dist --no-progress --no-interaction

      # ⚙️ Copia o .env de exemplo
      - name: Copiar .env
        run: cp .env.example .env

      # 🛠️ Configura credenciais do banco no .env
      - name: Configurar banco de dados
        run: |
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=sys_erp_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          echo "✅ Configuração do banco:"
          grep DB_ .env

      # 🔐 Gera chave da aplicação Laravel
      - name: Gerar chave da aplicação
        run: php artisan key:generate

      # 🗃️ Executa migrations (DESCOMENTADO)
      - name: Rodar migrations
        run: php artisan migrate --force

      # 🌱 Popula banco de dados (opcional)
      - name: Seed banco de dados
        run: php artisan db:seed --force || echo "⚠️ Sem seeds configurados"
        continue-on-error: true

      # ▶️ Inicia o servidor Laravel em segundo plano
      - name: Iniciar servidor Laravel
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      # ⏳ Aguarda o servidor subir antes de rodar os testes
      - name: Aguardar servidor subir
        run: |
          echo "⏳ Aguardando servidor Laravel..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000 > /dev/null; then
              echo "✅ Servidor respondendo!"
              exit 0
            fi
            echo "Tentativa $i/30..."
            sleep 2
          done
          echo "❌ Servidor não subiu a tempo"
          exit 1

      # 🧰 Instala Node.js e prepara ambiente para Cypress
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 📦 Instala dependências do projeto frontend
      - name: Instalar dependências Node
        run: npm ci

      # ✅ Verifica se o Cypress está instalado corretamente
      - name: Verificar Cypress
        run: npx cypress verify

      # 🧪 Executa os testes Cypress
      - name: Executar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/combrim.cy.js,cypress/e2e/criar-pedido.cy.js
          headed: false
          record: false
          config: video=true,screenshotOnRunFailure=true
          wait-on: 'http://127.0.0.1:8000'
          wait-on-timeout: 60
        env:
          CYPRESS_baseUrl: ${{ env.CYPRESS_baseUrl }}

      # 📸 Faz upload de screenshots se houver falhas
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      # 🎥 Faz upload dos vídeos dos testes
      - name: Upload vídeos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      # 📊 Gera resumo dos testes no painel do GitHub
      - name: Gerar relatório
        if: always()
        run: |
          echo "## 🧪 Resultados dos Testes Cypress" >> $GITHUB_STEP_SUMMARY
          echo "Browser: **Chrome**" >> $GITHUB_STEP_SUMMARY
          echo "Status: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Veja os artefatos acima para screenshots e vídeos" >> $GITHUB_STEP_SUMMARY

      # 🧹 Finaliza servidor Laravel
      - name: Stop servidor
        if: always()
        run: pkill -f "php artisan serve" || true

  # 📣 Job final para notificar resultado geral
  notify:
    name: Notificar Resultado
    runs-on: ubuntu-latest
    needs: [cypress-tests]
    if: always()

    steps:
      - name: Resultado dos testes
        run: |
          echo "## 📊 Pipeline Completo" >> $GITHUB_STEP_SUMMARY
          echo "✅ Execução finalizada" >> $GITHUB_STEP_SUMMARY
          echo "Status: **${{ needs.cypress-tests.result }}**" >> $GITHUB_STEP_SUMMARY