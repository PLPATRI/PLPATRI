name: Cypress E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CYPRESS_baseUrl: http://127.0.0.1:8000

jobs:
  cypress-tests:
    name: Cypress E2E Tests (Chrome)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar PHP e extensões
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, zip, dom, xml
          coverage: none

      - name: Instalar dependências Laravel
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copiar .env
        run: cp .env.example .env

      - name: Gerar chave da aplicação
        run: php artisan key:generate

      - name: Configurar permissões
        run: chmod -R 777 storage bootstrap/cache

      - name: Iniciar servidor Laravel
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Aguardar servidor subir
        run: |
          echo "Aguardando servidor Laravel..."
          for i in {1..60}; do
            if curl -s http://127.0.0.1:8000 > /dev/null; then
              echo "Servidor respondendo!"
              sleep 5
              exit 0
            fi
            echo "Tentativa $i/60..."
            sleep 2
          done
          echo "Servidor nao subiu"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências Node
        run: npm ci

      - name: Verificar Cypress
        run: npx cypress verify

      - name: Executar testes Cypress
        run: npx cypress run --spec "cypress/e2e/combrim.cy.js" --browser chrome --config defaultCommandTimeout=30000,pageLoadTimeout=90000
        env:
          CYPRESS_baseUrl: http://127.0.0.1:8000

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 3
          if-no-files-found: ignore

      - name: Gerar relatorio
        if: always()
        run: |
          echo "## Resultados" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Stop servidor
        if: always()
        run: pkill -f "php artisan serve" || true