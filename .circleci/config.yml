version: 2.1
jobs:
  test:
    docker:
      - image: cimg/php:8.2-node
    steps:
      - checkout
      
      # Instalar dependências do Composer
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-
      - run:
          name: Install Composer Dependencies
          command: |
            composer install --no-interaction --prefer-dist
            composer require doctrine/dbal --dev --no-interaction
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor
      
      # Configurar Laravel
      - run:
          name: Setup Laravel
          command: |
            cp .env.example .env || echo "APP_KEY=" > .env
            echo "DB_CONNECTION=sqlite" >> .env
            echo "DB_DATABASE=:memory:" >> .env
            php artisan key:generate
            php artisan config:clear
            
      # Criar banco de dados e rodar migrations
      - run:
          name: Setup Database
          command: |
            touch database/database.sqlite
            php artisan migrate:fresh --seed --force
      
      # Instalar dependências do Cypress
      - run:
          name: Install Cypress System Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb
      
      # Instalar dependências do Cypress
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-
      - run:
          name: Install Node Dependencies
          command: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.cache
      
      # Iniciar servidor Laravel
      - run:
          name: Start Laravel Server
          command: php artisan serve --host=127.0.0.1 --port=8000
          background: true
      
      # Esperar servidor ficar pronto
      - run:
          name: Wait for server
          command: |
            echo "Aguardando servidor Laravel iniciar..."
            for i in {1..30}; do
              if curl -s http://127.0.0.1:8000 > /dev/null 2>&1; then
                echo "✓ Servidor está respondendo!"
                exit 0
              fi
              echo "Tentativa $i/30 - Aguardando..."
              sleep 2
            done
            echo "✗ Erro: Servidor não respondeu após 60 segundos"
            echo "Verificando processos PHP:"
            ps aux | grep php
            exit 1
      
      # Rodar testes Cypress
      - run:
          name: Run Cypress Tests
          command: npx cypress run
      
      # Salvar artefatos
      - store_artifacts:
          path: cypress/videos
      - store_artifacts:
          path: cypress/screenshots

workflows:
  build:
    jobs:
      - test